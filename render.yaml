services:

  # =========================
  # Sathio Backend
  # =========================
  - type: web
    name: sathio-api
    runtime: python
    plan: free

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: "*"

      - key: DATABASE_URL
        sync: false


  # =========================
  # Sathio Frontend
  # =========================
  - type: web
    name: sathio-web
    runtime: static

    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        value: https://sathio-api.onrender.com

    routes:
      - type: rewrite
        source: /*
        destination: /index.html